baseURL = "https://vajska.rs/"
title = "Vajska"
theme = "selo"            # shared engine: github.com/kstein78/selo (git submodule in themes/selo)
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = true
timeZone = "Europe/Belgrade"

# --- Languages -------------------------------------------------------------
# Prototype: Serbian (Latin; cyr = the same text in Cyrillic, generated by themes/selo/scripts/sr_cyrl.py),
# Croatian (right after Serbian: the Croatian border is a few km away), English and Russian. German and Hungarian switch on once translated (remove them from disableLanguages).
defaultContentLanguage = "sr"
defaultContentLanguageInSubdir = true
disableLanguages = ["de", "hu"]

[languages]
  [languages.sr]
    languageName = "Srpski"
    languageCode = "sr-Latn"
    weight = 1
    contentDir = "content/sr"
    [languages.sr.params]
      tagline = "Selo uz Dunav u opštini Bač"
      description = "Vajska: selo uz Dunav kod Bača, za meštane i goste. Vesti, korisne informacije, istorija, praznici i izleti: jezero Provala, Bačka tvrđava, Bođani, Selenča i Sombor."
      ogLocale = "sr_RS"
  [languages.cyr]
    languageName = "Српски"
    languageCode = "sr-Cyrl"
    weight = 2
    contentDir = "content/cyr"
    [languages.cyr.params]
      tagline = "Село уз Дунав у општини Бач"
      description = "Вајска: село уз Дунав код Бача, за мештане и госте. Вести, корисне информације, историја, празници и излети: језеро Провала, Бачка тврђава, Бођани, Селенча и Сомбор."
      ogLocale = "sr_RS"
  [languages.hr]
    languageName = "Hrvatski"
    languageCode = "hr"
    weight = 3
    contentDir = "content/hr"
    [languages.hr.params]
      tagline = "Selo uz Dunav u općini Bač"
      description = "Vajska: selo uz Dunav kraj Bača, za mještane i goste. Vijesti, korisne informacije, povijest, blagdani i izleti: jezero Provala, tvrđava Bač, Bođani, Selenča i Sombor."
      ogLocale = "hr_HR"
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 4
    contentDir = "content/en"
    [languages.en.params]
      tagline = "A Danube village in Bač municipality"
      description = "Vajska, a Danube village near Bač, Serbia, for residents and visitors: news, practical information, history, festivals and trips to Lake Provala, Bač Fortress, Bođani, Selenča and Sombor."
      ogLocale = "en_US"
  [languages.ru]
    languageName = "Русский"
    languageCode = "ru"
    weight = 5
    contentDir = "content/ru"
    [languages.ru.params]
      tagline = "Село у Дуная в общине Бач"
      description = "Вайска — село у Дуная рядом с Бачем (Сербия), для жителей и гостей: новости, полезная информация, история, праздники и поездки к озеру Провала, крепости Бач, в Бођани, Селенчу и Сомбор."
      ogLocale = "ru_RU"
  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 6
    contentDir = "content/de"
    [languages.de.params]
      tagline = "Ein Dorf an der Donau in der Gemeinde Bač"
      description = "Vajska, ein Donaudorf bei Bač in Serbien."
      ogLocale = "de_DE"
  [languages.hu]
    languageName = "Magyar"
    languageCode = "hu"
    weight = 7
    contentDir = "content/hu"
    [languages.hu.params]
      tagline = "Dunai falu Bács községben"
      description = "Vajszka, dunai falu Bács mellett, Szerbiában."
      ogLocale = "hu_HU"

# --- Site-wide settings ----------------------------------------------------
[params]
  mapCenter = [45.41203, 19.11212]   # village centre (OpenStreetMap / Nominatim)
  mapZoom = 13
  coordsLabel = "45.41° N 19.11° E"
  themeColor = "#5e1d22"
  showPhotoBadges = false
  showTodos = false
  contactEmail = "konstantin.stein@gmail.com"
  authorName = "Svetlana Morozova"
  defaultAuthor = "svetlana"          # data/authors.yaml; pages may set their own "author:"
  authorSite = ""
  instagram = ""
  instagramHandle = ""
  gaID = ""
  yandexMetrica = ""
  translatorContext = "vajska.rs, a local site of the village of Vajska (Bač municipality, Bačka, Vojvodina, Serbia) for residents and visitors"
  llmsIntro = """> Local site of Vajska (Serbian: Вајска, Hungarian: Vajszka), a village on the Danube in Bač municipality,
> Vojvodina, Serbia: news, practical information for residents, history, festivals and trips in the surroundings
> (Lake Provala, Bač Fortress, Bođani Monastery, Selenča, Sombor). Edited by Svetlana Morozova, who lives in Vajska;
> co-founded and built by Konstantin (Kosta) Stein (rakovac.rs). Sister site about Lake Provala: https://provala.rs/"""
  photoCredit = "credited under each photo"
  alternateNames = ["Vajska", "Вајска", "Vajszka", "vajska.rs"]
  [params.place]
    type = "TouristDestination"
    name = "Vajska"
    alternateNames = ["Vajska", "Вајска", "Vajszka", "Józsefháza", "Wajska"]
    sameAs = ["https://en.wikipedia.org/wiki/Vajska"]
    containedIn = "Bač municipality, South Bačka, Vojvodina, Serbia"
  [params.emblem]
    title = "Vajska"
    letter = "V"
    corner = "wheat"
    base = "swan"
    shield = "#5e1d22"
    line = "#d9a441"
    ink = "#f7efe0"
    motif = "#e3b65a"
    mono = "#f5efe3"
    touch_bg = "#f6f1e7"
  [params.capital]
    # shield, outline/ornaments, leaf green, letter, light leaf, gold, mid green, red
    palette = ["#5e1d22", "#d9a441", "#7d8f3a", "#f7efe0", "#c9b56a", "#e3b65a", "#a39a4a", "#b3321f"]
  [params.share]
    bg = "#5e1d22"
    ink = "#f7efe0"
    sub = "#ecdcc4"
    accent = "#e3b65a"
    photo = "img/placeholder-vajska.jpg"
    logo = "img/brand-shield.svg"

[markup.goldmark.renderer]
  unsafe = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  root = true

[outputs]
  home = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]

[sitemap]
  changeFreq = "weekly"
